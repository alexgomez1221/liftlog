name: Security

# Static analysis. Five independent checks, each in its own job so one
# failure doesn't hide the others:
#
#   checkov     Terraform misconfiguration
#   trivy       filesystem and dependency scan
#   gitleaks    secrets in history and on push
#   codeql      JavaScript in api/
#   pin-check   fail if any action is unpinned (stale pins only warn)
#
# Findings upload to the Security tab as SARIF where the tool supports it,
# so results are reviewable rather than buried in log output.
#
# Suppressions belong inline, next to the code, with a reason. A blanket
# skip list at the top of this file is how a scanner quietly stops working.
# See docs/SECURITY.md for the assessment these checks enforce.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly. New CVEs land against unchanged code, so a scan that only runs
    # on push goes stale the moment development pauses.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Terraform misconfiguration
  # ---------------------------------------------------------------------
  checkov:
    name: Checkov (terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Checkov is run directly rather than through bridgecrewio/checkov-action.
      #
      # That action has published no release since 2022 and only moves
      # `master`, so pinning it means pinning to a branch SHA that is stale by
      # construction — permanently flagged, never actionable. It also puts a
      # third-party action, with whatever permissions this job holds, between
      # us and a tool that is one pip install away.
      #
      # Removing it drops a supply chain dependency and makes the local and CI
      # invocations identical, which matters because suppressions are verified
      # locally before they are pushed.
      #
      # The version is pinned deliberately. Bump it consciously — a scanner
      # that silently changes what it reports is a scanner you cannot baseline
      # against. Current local baseline: 109 passed, 0 failed, 25 skipped.
      - name: Install Checkov
        run: pip install --disable-pip-version-check 'checkov==3.3.9'

      # skip_check is deliberately empty. The findings we accept are suppressed
      # inline on the resources themselves, each with a written reason.
      #
      # If a run surfaces something new, triage it into either a fix or an
      # inline `#checkov:skip=<ID>:<reason>` comment. Never a list here.
      # NOTE on --output-file-path: the second element must be a FILE, not a
      # directory, even though `checkov --help` calls it "the output folder".
      # Passing a directory there produces console output and silently writes
      # no SARIF at all — the upload step then fails on a missing file, or
      # worse, uploads nothing and looks fine.
      - name: Run Checkov
        run: |
          checkov -d infra --framework terraform --compact \
            -o cli -o sarif --output-file-path console,checkov.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        # Uploading SARIF needs security-events: write, which a Dependabot
        # PR's read-only token does not have. Scan still runs and still gates
        # the build; only the Security-tab upload is skipped.
        if: (success() || failure()) && github.actor != 'dependabot[bot]'
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ---------------------------------------------------------------------
  # Filesystem / dependency scan
  # ---------------------------------------------------------------------
  trivy:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # vuln,secret only — misconfig is deliberately NOT enabled.
      #
      # Checkov owns Terraform here. Running Trivy's misconfig scanner too
      # meant the same decisions were reported twice under two rule
      # vocabularies, and Trivy does not read Checkov's inline
      # `#checkov:skip` comments — so silencing it would mean a second,
      # parallel suppression file that drifts out of step with the first.
      # The first CI run produced exactly four misconfig findings, all four
      # already documented Checkov suppressions (AWS-0132 x2 = CKV_AWS_145,
      # AWS-0345 = CKV_AWS_356, AWS-0136 = the SNS managed-key decision).
      #
      # One of them was wrong on its own terms: AWS-0132 fired on the S3
      # access-log destination bucket, while the rule's own text says
      # "SSE-KMS is not supported for S3 server access logging destination
      # buckets; in such cases, use SSE-S3 instead" — which is what that
      # bucket does.
      #
      # Two scanners disagreeing is useful. Two scanners repeating each other
      # into a suppression file nobody maintains is not.
      #
      # The handler has no npm dependencies — the AWS SDK v3 ships with the
      # nodejs20.x runtime — so what remains is a dependency and secret
      # sweep. It starts earning its keep the moment a package.json appears,
      # and it covers ground Checkov does not touch at all.
      #
      # v-prefixed tag, and not by accident. trivy-action was the subject of a
      # supply chain attack; as part of the response the maintainers migrated
      # every tag to a `v` prefix and removed the old unprefixed ones. The
      # bare `0.28.0` this workflow originally referenced no longer resolves,
      # which is precisely the failure mode a mutable tag invites — and the
      # reason every entry in this file is pinned to a SHA below.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          # Report and upload, then gate in a separate step so the SARIF
          # still reaches the Security tab when findings exist.
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        # Uploading SARIF needs security-events: write, which a Dependabot
        # PR's read-only token does not have. Scan still runs and still gates
        # the build; only the Security-tab upload is skipped.
        if: (success() || failure()) && github.actor != 'dependabot[bot]'
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

  # ---------------------------------------------------------------------
  # Secrets
  # ---------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so history is scanned, not just the tip. Two AWS
      # access keys have already been exposed on this project (via
      # screenshots, not commits) — see L-7 in docs/SECURITY.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Free for public repositories and personal accounts. Moving this repo
      # into a GitHub organisation would require a GITLEAKS_LICENSE secret.
      #
      # This is detection after the fact. The control that actually prevents
      # a leak is GitHub push protection — Settings → Code security → Secret
      # scanning. Enable both; they are not substitutes for each other.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # JavaScript
  # ---------------------------------------------------------------------
  codeql:
    name: CodeQL (javascript)
    # CodeQL always publishes its results, so it cannot run without
    # security-events: write — which Dependabot PRs do not get. Skipped rather
    # than left to fail. Dependabot only edits action pins in
    # .github/workflows, so there is no JavaScript change for it to analyse.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NOTE: CodeQL extracts .js/.mjs files. The app's JavaScript lives in
      # an inline <script> block in index.html and is NOT analysed here —
      # which is exactly where finding L-1 (unescaped IDs in HTML
      # attributes) lives. Treat this job as covering api/ only. Extracting
      # the app script to its own .js file would bring it in scope, at the
      # cost of the single-file property the PWA is built around.
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          category: /language:javascript-typescript

  # ---------------------------------------------------------------------
  # Supply chain: action pinning
  # ---------------------------------------------------------------------
  pin-check:
    name: Actions pinned to SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A mutable tag like @v4 means whoever controls that repo can change
      # what runs in CI. The apply job in terraform.yml holds write access to
      # this account's infrastructure, so an action it trusts is an action
      # that can reach AWS.
      #
      # This fails only on UNPINNED entries. A pin that has fallen behind its
      # tag is reported as a warning and left to Dependabot, which opens a PR
      # for it. Failing on staleness turned every upstream release into a red
      # build on main until someone merged — and a check that is red for
      # reasons nobody can act on right now is a check people stop reading.
      # Use --strict if you ever want the harder behaviour.
      #
      # GITHUB_TOKEN raises the anonymous API rate limit, which the script
      # will otherwise hit resolving several actions per file.
      - name: Check pins
        run: ./scripts/pin-actions.sh --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
