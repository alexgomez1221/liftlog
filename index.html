<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black" (not black-translucent): iOS lays the web view out BELOW the status
     bar instead of underneath it, so the header can never hide behind the
     Dynamic Island. viewport-fit=cover is kept so the bottom still extends
     under the home indicator, which our --safe-b padding handles. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Track weight lifting workouts, routines, personal records and progressive overload.">
<meta name="format-detection" content="telephone=no">
<title>Lift Log</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<style>
  :root{
    --bg:#0b0d12; --panel:#151920; --panel2:#1c212b; --panel3:#232935; --border:#2b3140;
    --text:#eef1f6; --muted:#8b93a5; --dim:#5f6779;
    --accent:#3b82f6; --accent-dim:#1e3a6b;
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444; --purple:#8b5cf6;
    --warmup:#f59e0b; --drop:#3b82f6; --failure:#ef4444;
    --ss1:#8b5cf6; --ss2:#ec4899; --ss3:#14b8a6; --ss4:#f97316;
    --r:12px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    -webkit-user-select:none;user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;
    overscroll-behavior-y:none;overflow:hidden;
  }
  input,select,textarea,button{font-family:inherit;font-size:inherit;}
  input,textarea{-webkit-user-select:text;user-select:text;}
  /* iOS zooms the page when a focused input is under 16px */
  input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{font-size:16px}
  .setinput{font-size:16px}
  h1,h2,h3,h4{margin:0;font-weight:700;}
  a{color:var(--accent);}

  /* ---------- layout ---------- */
  /* iOS standalone: the web view runs edge-to-edge under the Dynamic Island /
     notch, so the shell must inset itself by the top safe area or the header
     lands underneath it. 100dvh tracks the real visible height (100% resolves
     against a viewport that ignores the status bar, leaving a gap at the foot). */
  #app{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    padding-top:var(--safe-t);
    max-width:560px;margin:0 auto;position:relative;
  }
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 24px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .screen-head{padding:14px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);z-index:5;}
  .screen-head .iconbtn{padding:10px;margin:-10px -6px -10px 0;}  /* bigger tap target, no visual shift */
  .screen-head h1{font-size:24px;letter-spacing:-.02em;}

  nav.tabbar{
    display:flex;background:var(--panel);border-top:1px solid var(--border);
    padding:6px 0 calc(6px + var(--safe-b));position:sticky;bottom:0;z-index:20;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;color:var(--dim);font-size:10px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;
    letter-spacing:.02em;
  }
  nav.tabbar button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  nav.tabbar button.active{color:var(--accent);}

  /* ---------- primitives ---------- */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;}
  .row{display:flex;gap:10px;align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .spread{justify-content:space-between;}
  .muted{color:var(--muted);font-size:13px;}
  .dim{color:var(--dim);font-size:12px;}
  .tiny{font-size:11px;}
  label.fl{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:10px 11px;width:100%;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;}
  .btn:active{opacity:.8;}
  .btn.block{width:100%;}
  .btn.sec{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:8px;}
  .btn.xs{padding:5px 9px;font-size:12px;border-radius:7px;font-weight:600;}
  .btn.green{background:var(--good);}
  .iconbtn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;display:flex;align-items:center;border-radius:7px;}
  .iconbtn:active{background:var(--panel2);}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .divider{height:1px;background:var(--border);margin:12px 0;}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:32px 12px;}
  .hidden{display:none !important;}
  .scroll-x{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .scroll-x::-webkit-scrollbar{display:none;}
  .badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.04em;}
  .badge.pr{background:var(--warn);color:#000;}
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* ---------- routines ---------- */
  .folder-head{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 8px;}
  .folder-head h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .routine-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;}
  .routine-card h4{font-size:15px;margin-bottom:4px;}
  .routine-card .exlist{color:var(--muted);font-size:13px;line-height:1.45;}

  /* ---------- live session ---------- */
  #sessionScreen{
    position:fixed;inset:0;background:var(--bg);z-index:100;display:none;
    flex-direction:column;max-width:560px;margin:0 auto;
  }
  #sessionScreen.on{display:flex;}
  .sess-head{
    padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  .sess-head .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .sess-title{font-size:17px;font-weight:700;background:none;border:none;color:var(--text);padding:0;width:auto;flex:1;}
  .sess-stats{display:flex;gap:20px;margin-top:8px;}
  .sess-stats div{font-size:12px;color:var(--muted);}
  .sess-stats b{display:block;color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .sess-body{flex:1;overflow-y:auto;padding:14px 14px 120px;}

  .ex-block{margin-bottom:20px;position:relative;}
  .ex-block.in-ss{border-left:3px solid var(--ss1);padding-left:10px;margin-left:-13px;}
  .ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .ex-name-btn{background:none;border:none;color:var(--accent);font-weight:700;font-size:15px;padding:0;text-align:left;cursor:pointer;flex:1;}
  .ss-tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:#fff;}
  .ex-note{width:100%;background:none;border:none;color:var(--muted);font-size:13px;padding:3px 0;font-style:italic;}
  .ex-note::placeholder{color:var(--dim);}
  .rest-line{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin:4px 0 8px;cursor:pointer;}

  table.sets{width:100%;border-collapse:collapse;}
  table.sets th{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:4px 3px;text-align:center;}
  table.sets th.l{text-align:left;}
  table.sets td{padding:3px;text-align:center;}
  table.sets tr.done td{background:rgba(34,197,94,.09);}
  table.sets tr.done td:first-child{border-radius:8px 0 0 8px;}
  table.sets tr.done td:last-child{border-radius:0 8px 8px 0;}
  .setbtn{width:30px;height:30px;border-radius:8px;background:var(--panel2);border:none;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;}
  .setbtn.warmup{color:var(--warmup);}
  .setbtn.drop{color:var(--drop);}
  .setbtn.failure{color:var(--failure);}
  .prev-cell{font-size:12px;color:var(--dim);white-space:nowrap;min-width:70px;}
  .setinput{width:100%;min-width:52px;background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:8px 4px;text-align:center;color:var(--text);font-variant-numeric:tabular-nums;font-weight:600;}
  tr.done .setinput{background:transparent;color:var(--text);}
  .setinput::placeholder{color:var(--dim);font-weight:400;}
  .checkbtn{width:32px;height:30px;border-radius:8px;background:var(--panel2);border:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .checkbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .checkbtn.on{background:var(--good);color:#fff;}
  .addset{width:100%;background:var(--panel2);border:none;color:var(--muted);border-radius:8px;padding:9px;font-size:13px;font-weight:700;margin-top:7px;cursor:pointer;}

  .rest-bar{
    position:absolute;left:0;right:0;bottom:0;background:var(--accent);color:#fff;
    padding:11px 16px calc(11px + var(--safe-b));display:flex;align-items:center;justify-content:space-between;
    font-weight:700;z-index:5;
  }
  .rest-bar .t{font-size:19px;font-variant-numeric:tabular-nums;}
  .rest-bar button{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:7px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer;}
  .sess-foot{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(10px + var(--safe-b));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:9px;}

  /* ---------- modal ---------- */
  /* Sheets are position:fixed, so they sit OUTSIDE #app and get none of its
     safe-area padding — they need their own, or the header lands under the
     Dynamic Island and its close button becomes untappable. */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;
    display:flex;align-items:flex-end;justify-content:center;
    padding-top:calc(var(--safe-t) + 8px);
  }
  .sheet{
    background:var(--panel);width:100%;max-width:560px;
    max-height:100%;
    border-radius:18px 18px 0 0;display:flex;flex-direction:column;
    overflow:hidden;animation:up .18s ease;
  }
  @keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{padding:15px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;}
  .sheet-head h2{font-size:17px;}
  .sheet-head .iconbtn{padding:10px;margin:-10px -6px -10px 0;}  /* bigger tap target */
  .sheet-body{overflow-y:auto;padding:14px 16px calc(18px + var(--safe-b));flex:1;-webkit-overflow-scrolling:touch;}
  .overlay.center{align-items:center;padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 18px);}
  .overlay.center .sheet{border-radius:16px;}
  .menu-item{display:flex;align-items:center;gap:11px;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px;}
  .menu-item:last-child{border-bottom:none;}
  .menu-item .k{width:24px;text-align:center;font-weight:800;font-size:13px;}

  .ex-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .ex-row:last-child{border-bottom:none;}
  .ex-av{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--muted);flex-shrink:0;}
  .ex-row .nm{font-weight:600;font-size:14px;}
  .ex-row.sel{background:var(--accent-dim);border-radius:9px;}
  .ex-row .cnt{margin-left:auto;color:var(--accent);font-weight:800;font-size:13px;}

  /* ---------- stats / charts ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .stat-box{background:var(--panel2);border-radius:10px;padding:11px 12px;}
  .stat-box .lb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .stat-box .vl{font-size:19px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
  .stat-box .sub{font-size:11px;color:var(--dim);margin-top:1px;}
  svg.chart{width:100%;display:block;overflow:visible;}
  .bar-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .bar-row .nm{font-size:12px;width:86px;color:var(--muted);flex-shrink:0;}
  .bar-track{flex:1;height:16px;background:var(--panel2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .bar-row .vl{font-size:12px;font-weight:700;width:34px;text-align:right;font-variant-numeric:tabular-nums;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal div{aspect-ratio:1;border-radius:4px;background:var(--panel2);}
  .cal div.on{background:var(--good);}
  .cal div.hd{background:none;font-size:9px;color:var(--dim);text-align:center;aspect-ratio:auto;}

  .body-wrap{display:flex;gap:6px;justify-content:center;}
  svg.body{width:100%;max-width:135px;height:auto;}
  .legend{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);}
  .legend i{width:10px;height:10px;border-radius:3px;}

  .hist-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;}
  .hist-item h4{font-size:15px;}
  .hist-meta{display:flex;gap:14px;margin:6px 0 9px;font-size:12px;color:var(--muted);}
  .hist-line{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;}
  .hist-line .l{color:var(--muted);}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:var(--panel3);border:1px solid var(--border);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .toast.pr{background:var(--warn);color:#000;border-color:var(--warn);}
  .banner{background:var(--warn);color:#000;border-radius:10px;padding:11px 13px;margin-bottom:11px;display:flex;align-items:center;gap:10px;}
  .banner b{font-size:13px;}
</style>
</head>
<body>

<div id="app">
  <main>
    <!-- ============ WORKOUT ============ -->
    <section class="screen active" id="s-workout">
      <div class="screen-head"><h1>Workout</h1>
        <button class="iconbtn" id="settingsBtn" title="Settings">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div id="backupBanner"></div>
      <button class="btn block" id="startEmptyBtn" style="margin-bottom:9px;">＋ Start Empty Workout</button>
      <button class="btn sec block sm" id="logPastBtn" style="margin-bottom:6px;">🗓 Log a Past Workout</button>
      <div class="folder-head"><h3>Routines</h3>
        <div class="row" style="gap:6px;">
          <button class="btn xs sec" id="newFolderBtn">New folder</button>
          <button class="btn xs" id="newRoutineBtn">＋ Routine</button>
        </div>
      </div>
      <div id="routinesList"></div>
    </section>

    <!-- ============ HISTORY ============ -->
    <section class="screen" id="s-history">
      <div class="screen-head"><h1>History</h1></div>
      <div id="historyList"></div>
    </section>

    <!-- ============ EXERCISES ============ -->
    <section class="screen" id="s-exercises">
      <div class="screen-head"><h1>Exercises</h1>
        <button class="btn xs sec" id="newExerciseBtn">＋ Custom</button>
      </div>
      <input type="text" id="exSearch" placeholder="Search exercises..." style="margin-bottom:10px;">
      <div class="scroll-x" id="exMuscleFilters" style="margin-bottom:7px;"></div>
      <div class="scroll-x" id="exEquipFilters" style="margin-bottom:12px;"></div>
      <div id="exLibList"></div>
    </section>

    <!-- ============ PROFILE ============ -->
    <section class="screen" id="s-profile">
      <div class="screen-head"><h1>Profile</h1></div>
      <div id="profileBody"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-s="workout" class="active">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11v11h-11z" opacity="0"/><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10"/></svg>
      Workout
    </button>
    <button data-s="history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      History
    </button>
    <button data-s="exercises">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      Exercises
    </button>
    <button data-s="profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </button>
  </nav>
</div>

<!-- ============ LIVE SESSION ============ -->
<div id="sessionScreen">
  <div class="sess-head">
    <div class="toprow">
      <button class="iconbtn" id="sessMinimize" title="Minimize">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <input class="sess-title" id="sessTitle" value="Workout">
      <button class="btn sm green" id="sessFinish">Finish</button>
    </div>
    <div class="sess-stats">
      <div>Duration<b id="sessTimer">0:00</b></div>
      <div>Volume<b id="sessVolume">0 lbs</b></div>
      <div>Sets<b id="sessSets">0</b></div>
    </div>
  </div>
  <div class="sess-body" id="sessBody"></div>
  <div class="sess-foot" id="sessFoot">
    <button class="btn sec" style="flex:1;" id="sessAddEx">＋ Add Exercise</button>
    <button class="btn danger sm" id="sessDiscard">Discard</button>
  </div>
  <div class="rest-bar hidden" id="restBar">
    <button id="restMinus">−15s</button>
    <div class="t" id="restTime">0:00</div>
    <button id="restPlus">+15s</button>
    <button id="restSkip">Skip</button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* =====================================================================
   PART 1 — DATA MODEL, EXERCISE LIBRARY, STORAGE, MATH
   ===================================================================== */

const LS = {
  profile:'ll_profile', workouts:'ll_workouts', routines:'ll_routines',
  folders:'ll_folders', customEx:'ll_customEx', active:'ll_active', bodyLog:'ll_bodyLog',

// Measures what env(safe-area-inset-*) actually resolves to on THIS device by
// sizing a hidden probe with them — CSS custom properties can't be read back
// via getComputedStyle in a way that reports the resolved pixel value.
function probeInsets(){
  let t=0,b=0;
  try{
    const p = document.createElement('div');
    p.style.cssText = 'position:fixed;top:-9999px;left:-9999px;visibility:hidden;'+
                      'height:env(safe-area-inset-top,0px);width:env(safe-area-inset-bottom,0px);';
    document.body.appendChild(p);
    t = p.offsetHeight; b = p.offsetWidth;
    p.remove();
  }catch(e){}
  return {t, b};
}

/* An installed iOS PWA whose status bar is translucent lays content out starting
   at screen y=0, but reports window.innerHeight as the screen height MINUS the
   status bar. The result is a dead strip at the foot of the page exactly as tall
   as the status bar. Detect that specific mismatch and set the height explicitly.
   (Note: the status-bar meta tag is captured when the app is added to the home
   screen, so changing it only takes effect after removing and re-adding the app.
   This correction makes the layout right either way.) */
function fitAppHeight(){
  const el = document.getElementById('app');
  if(!el) return null;
  const ins = probeInsets();
  const ih = window.innerHeight;
  const sh = (window.screen && window.screen.height) || ih;
  const missing = sh - ih;
  const translucentQuirk = ins.t > 0 && Math.abs(missing - ins.t) <= 2;
  if(translucentQuirk) el.style.height = (ih + ins.t) + 'px';
  else el.style.height = '';
  return translucentQuirk;
}

function layoutDiag(){
  const ins = probeInsets();
  const appEl = document.getElementById('app');
  return {
    safeTop: ins.t, safeBottom: ins.b,
    innerH: window.innerHeight,
    screenH: (window.screen && window.screen.height) || 0,
    appH: appEl ? appEl.offsetHeight : 0,
    appPadTop: appEl ? Math.round(parseFloat(getComputedStyle(appEl).paddingTop)||0) : 0,
    fitted: appEl ? !!appEl.style.height : false,
    standalone: (window.navigator.standalone === true) ||
                (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
  };
}

// Falls back to the default for missing keys, unparseable JSON, AND a stored
// literal null/undefined (save(key, null) writes the string "null").
function load(k, d){
  try{
    const v = localStorage.getItem(k);
    if(v === null || v === '') return d;
    const p = JSON.parse(v);
    if(p === null || p === undefined) return d;
    if(Array.isArray(d) && !Array.isArray(p)) return d;   // shape guard
    return p;
  }catch(e){ return d; }
}

// Layer 1: ask the browser not to evict our data (iOS Safari evicts after ~7 idle days).
async function requestPersistence(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return null;
    if(await navigator.storage.persisted()) return true;
    const granted = await navigator.storage.persist();
    meta.persistAsked = true; save(LS.meta, meta);
    return granted;
  }catch(e){ return null; }
}
async function storageInfo(){
  try{
    const persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null;
    let usage = null;
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      usage = est.usage;
    }
    return {persisted, usage};
  }catch(e){ return {persisted:null, usage:null}; }
}

function importData(d, opts){
  if(!d || typeof d !== 'object') throw new Error('Not a valid backup file');
  if(!Array.isArray(d.workouts) && !Array.isArray(d.routines)) throw new Error('No workouts or routines found in that file');
  if(!(opts && opts.noSnapshot)) takeSnapshot('before import');
  if(d.profile)  profile  = d.profile;

  if(Array.isArray(d.routines)) routines = d.routines;

  if(Array.isArray(d.customEx)) customEx = d.customEx;

  save(LS.folders,folders); save(LS.customEx,customEx); save(LS.bodyLog,bodyLog);
  return {workouts:(d.workouts||[]).length, routines:(d.routines||[]).length};
}

// Layer 3: rolling in-app snapshots (an undo, not a backup — same storage).
function takeSnapshot(reason){
  try{
    const snaps = load(LS.snapshots, []);
    snaps.push({at:new Date().toISOString(), reason:reason||'auto',
                workouts:workouts.length, data:exportData()});
    while(snaps.length > SNAPSHOT_KEEP) snaps.shift();
    save(LS.snapshots, snaps);

    try{ const s=load(LS.snapshots,[]); s.splice(0, Math.ceil(s.length/2)); save(LS.snapshots,s); }catch(_){}
  }
}

/* ---------- set / volume math ---------- */
const SET_TYPES = {normal:'',warmup:'W',drop:'D',failure:'F'};

// Warm-up sets are excluded from volume, PRs, and muscle set counts (matches Hevy).
function setCounts(s){ return s.done !== false && s.type !== 'warmup'; }

function setVolume(s, ex){
  if(!setCounts(s)) return 0;
  const reps = +s.reps||0;
  if(ex.type === 'b') return ((+s.weight||0) + bodyweight()) * reps;
  if(ex.type === 'd' || ex.type === 'c') return 0;
  return (+s.weight||0) * reps;
}
function setLoad(s, ex){ // effective load used for PR comparisons
  if(ex.type === 'b') return (+s.weight||0) + bodyweight();
  return +s.weight||0;
}
function epley1RM(w, reps){
  reps = +reps||0; w = +w||0;
  if(w<=0 || reps<=0) return 0;
  if(reps === 1) return w;
  return w * (1 + reps/30);
}
function set1RM(s, ex){
  if(!setCounts(s)) return 0;
  if(ex.type==='d'||ex.type==='c') return 0;
  return epley1RM(setLoad(s,ex), s.reps);
}

function exerciseVolume(exEntry){
  const ex = exById(exEntry.exId);
  return (exEntry.sets||[]).reduce((a,s)=>a+setVolume(s,ex),0);
}
function workoutVolume(w){
  return (w.exercises||[]).reduce((a,e)=>a+exerciseVolume(e),0);
}
function workoutSetCount(w){
  return (w.exercises||[]).reduce((a,e)=>a+(e.sets||[]).filter(setCounts).length,0);
}
function workoutRepCount(w){
  return (w.exercises||[]).reduce((a,e)=>a+(e.sets||[]).filter(setCounts).reduce((b,s)=>b+(+s.reps||0),0),0);
}

/* ---------- exercise history & records ---------- */
// Returns [{date, workoutId, workoutName, sets:[...]}] oldest→newest for one exercise
function exerciseHistory(exId, beforeDate){
  const out = [];
  workouts.forEach(w=>{
    if(beforeDate && w.date >= beforeDate) return;
    (w.exercises||[]).forEach(e=>{
      if(e.exId === exId) out.push({date:w.date, workoutId:w.id, workoutName:w.name, sets:e.sets||[], notes:e.notes});
    });
  });
  out.sort((a,b)=> a.date < b.date ? -1 : 1);
  return out;
}
function lastPerformance(exId, beforeDate){
  const h = exerciseHistory(exId, beforeDate);
  return h.length ? h[h.length-1] : null;
}

// All-time records for an exercise, optionally only counting workouts before a date.
function exerciseRecords(exId, beforeDate){
  const ex = exById(exId);
  const hist = exerciseHistory(exId, beforeDate);
  let heaviest=0, best1RM=0, bestSetVol=0, bestSessionVol=0, bestReps=0, bestDuration=0, bestDistance=0;
  const repRecords = {}; // reps -> max weight
  hist.forEach(h=>{
    let sessVol = 0;
    h.sets.forEach(s=>{
      if(!setCounts(s)) return;
      const load = setLoad(s,ex);
      const vol  = setVolume(s,ex);
      const orm  = set1RM(s,ex);
      sessVol += vol;
      if(load > heaviest) heaviest = load;
      if(orm  > best1RM) best1RM = orm;
      if(vol  > bestSetVol) bestSetVol = vol;
      if((+s.reps||0) > bestReps) bestReps = +s.reps||0;
      if((+s.durationSec||0) > bestDuration) bestDuration = +s.durationSec||0;
      if((+s.distance||0) > bestDistance) bestDistance = +s.distance||0;
      const r = +s.reps||0;
      if(r>0 && load>0 && load > (repRecords[r]||0)) repRecords[r] = load;
    });
    if(sessVol > bestSessionVol) bestSessionVol = sessVol;
  });
  return {heaviest, best1RM, bestSetVol, bestSessionVol, bestReps, bestDuration, bestDistance, repRecords, sessions:hist.length};
}

// Detect PRs for one just-completed set against all prior history (excluding current session).
function detectPRs(exId, s, priorRecords){
  const ex = exById(exId);
  if(!setCounts(s)) return [];
  const prs = [];
  const load = setLoad(s,ex), vol = setVolume(s,ex), orm = set1RM(s,ex), reps=+s.reps||0;
  if(ex.type==='d'){
    if((+s.durationSec||0) > priorRecords.bestDuration && +s.durationSec>0) prs.push('Best Time');
    return prs;
  }
  if(ex.type==='c'){
    if((+s.distance||0) > priorRecords.bestDistance && +s.distance>0) prs.push('Best Distance');
    return prs;
  }
  if(ex.type==='b' && load<=0){
    if(reps > priorRecords.bestReps && reps>0) prs.push('Most Reps');
    return prs;
  }
  if(load > priorRecords.heaviest && load>0) prs.push('Heaviest Weight');
  if(orm > priorRecords.best1RM && orm>0)    prs.push('Best Est. 1RM');
  if(vol > priorRecords.bestSetVol && vol>0) prs.push('Best Set Volume');
  if(reps>0 && load>0 && load > (priorRecords.repRecords[reps]||0)) prs.push(`${reps}-Rep PR`);
  return prs;
}

/* ---------- muscle aggregation ---------- */
function musclesOf(exId){
  const e = exById(exId);
  const out = {};
  if(e.primary) out[e.primary] = 1;          // primary counts as a full set
  (e.secondary||[]).forEach(m=>{ if(m) out[m] = Math.max(out[m]||0, 0.5); }); // secondary as half
  return out;
}
function setsPerMuscle(sessions){
  const agg = {};
  sessions.forEach(w=>(w.exercises||[]).forEach(e=>{
    const n = (e.sets||[]).filter(setCounts).length;
    if(!n) return;
    const m = musclesOf(e.exId);
    Object.keys(m).forEach(k=>{ agg[k] = (agg[k]||0) + n*m[k]; });
  }));
  return agg;
}
function volumePerMuscle(sessions){
  const agg = {};
  sessions.forEach(w=>(w.exercises||[]).forEach(e=>{
    const v = exerciseVolume(e);
    if(!v) return;
    const ex = exById(e.exId);
    if(ex.primary) agg[ex.primary] = (agg[ex.primary]||0) + v;
  }));
  return agg;
}

  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isPR?' pr':'');
  clearTimeout(_toastT);
  _toastT = setTimeout(()=>{ t.className='toast'+(isPR?' pr':''); }, isPR?2600:1900);
}

/* =====================================================================
   PART 2 — LIVE SESSION ENGINE
   ===================================================================== */

const SS_COLORS = ['var(--ss1)','var(--ss2)','var(--ss3)','var(--ss4)'];
const el = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let restTimer = null;      // {endsAt, total}
let sessionTick = null;
let priorRecordsCache = {};// exId -> records snapshot taken at session start

function newSet(type, prev){
  return {type: type||'normal', weight: prev? prev.weight : '', reps: prev? prev.reps : '',
          durationSec: prev? prev.durationSec : '', distance: prev? prev.distance : '',
          rpe:'', done:false};
}
function newExEntry(exId, opts){
  return Object.assign({exId, notes:'', restSec:90, supersetId:null, sets:[newSet('normal')]}, opts||{});
}

/* ---------- start / restore ---------- */
function startSession(opts){
  opts = opts || {};
  if(active && !confirm('A workout is already in progress. Discard it and start a new one?')) return;
  active = {
    id: uid('w'),
    name: opts.name || defaultWorkoutName(),
    routineId: opts.routineId || null,
    startedAt: new Date().toISOString(),
    backfillDate: opts.backfillDate || null,   // set when logging a past workout
    exercises: (opts.exercises || []).map(e=>({
      exId: e.exId, notes: e.notes||'', restSec: e.restSec==null?90:e.restSec,
      supersetId: e.supersetId||null,
      sets: (e.sets && e.sets.length ? e.sets : [newSet('normal')]).map(s=>({
        type:s.type||'normal', weight:s.weight==null?'':s.weight, reps:s.reps==null?'':s.reps,
        durationSec:s.durationSec||'', distance:s.distance||'', rpe:s.rpe||'', done:false
      }))
    }))
  };
  priorRecordsCache = {};
  active.exercises.forEach(e=>{ priorRecordsCache[e.exId] = exerciseRecords(e.exId); });
  persistActive();
  openSession();
}

function defaultWorkoutName(){
  const h = new Date().getHours();
  return h < 11 ? 'Morning Workout' : h < 17 ? 'Afternoon Workout' : 'Evening Workout';
}

function persistActive(){ save(LS.active, active); }

function openSession(){
  if(!active) return;
  el('sessionScreen').classList.add('on');
  el('sessTitle').value = active.name;
  renderSession();
  startSessionTick();
}
function minimizeSession(){
  el('sessionScreen').classList.remove('on');
  renderRoutines();
}
function startSessionTick(){
  clearInterval(sessionTick);
  sessionTick = setInterval(()=>{
    if(!active) return;
    el('sessTimer').textContent = fmtClock(sessionElapsed());
    tickRest();
  }, 1000);
  el('sessTimer').textContent = fmtClock(sessionElapsed());
}
function sessionElapsed(){
  if(!active) return 0;
  return (Date.now() - new Date(active.startedAt).getTime())/1000;
}

/* ---------- rest timer ---------- */
function startRest(seconds){
  if(!seconds || seconds<=0) return;
  restTimer = {endsAt: Date.now()+seconds*1000, total:seconds};
  renderRest();
}
function tickRest(){
  if(!restTimer) return;
  const left = (restTimer.endsAt - Date.now())/1000;
  if(left <= 0){
    restTimer = null;
    renderRest();
    beep();
    toast('Rest complete');
  } else renderRest();
}
function renderRest(){
  const bar = el('restBar'), foot = el('sessFoot');
  if(!restTimer){ bar.classList.add('hidden'); foot.classList.remove('hidden'); return; }
  bar.classList.remove('hidden'); foot.classList.add('hidden');
  el('restTime').textContent = fmtClock((restTimer.endsAt-Date.now())/1000);
}
function beep(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.18);
    setTimeout(()=>{ try{ctx.close();}catch(e){} }, 400);
  }catch(e){}
}
el('restSkip').onclick = ()=>{ restTimer=null; renderRest(); };
el('restPlus').onclick = ()=>{ if(restTimer){ restTimer.endsAt += 15000; renderRest(); } };
el('restMinus').onclick= ()=>{ if(restTimer){ restTimer.endsAt -= 15000; renderRest(); } };

/* ---------- superset helpers ---------- */
function ssColorFor(ssId){
  if(!ssId || !active) return null;
  const ids = [...new Set(active.exercises.map(e=>e.supersetId).filter(Boolean))];
  const i = ids.indexOf(ssId);
  return i<0 ? SS_COLORS[0] : SS_COLORS[i % SS_COLORS.length];
}

/* ---------- render session ---------- */
function renderSession(){
  if(!active) return;
  const body = el('sessBody');
  if(active.exercises.length === 0){
    body.innerHTML = '<div class="empty">No exercises yet.<br>Tap <b>Add Exercise</b> to get started.</div>';
    updateSessionStats();
    return;
  }
  body.innerHTML = active.exercises.map((e,i)=>exBlockHTML(e,i)).join('');
  wireSessionEvents();
  updateSessionStats();
}

function exBlockHTML(e, i){
  const ex = exById(e.exId);
  const prev = lastPerformance(e.exId, active.backfillDate ? active.backfillDate : undefined);
  const ssColor = ssColorFor(e.supersetId);
  const ssIds = [...new Set(active.exercises.map(x=>x.supersetId).filter(Boolean))];
  const ssLabel = e.supersetId ? String.fromCharCode(65 + ssIds.indexOf(e.supersetId)) : null;

  let normalIdx = 0;
  const rows = e.sets.map((s, si)=>{
    let label;
    if(s.type==='normal'){ normalIdx++; label = normalIdx; }
    else label = SET_TYPES[s.type];
    const prevSet = prev && prev.sets[si];
    const prevTxt = prevSet ? prevSetText(prevSet, ex) : '—';
    return `<tr class="${s.done?'done':''}">
      <td><button class="setbtn ${esc(s.type)}" data-act="settype" data-i="${i}" data-si="${si}">${label}</button></td>
      <td class="prev-cell">${esc(prevTxt)}</td>
      ${setInputCells(s, ex, i, si)}
      <td><button class="checkbtn ${s.done?'on':''}" data-act="check" data-i="${i}" data-si="${si}">
        <svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg></button></td>
    </tr>`;
  }).join('');

  return `<div class="ex-block ${e.supersetId?'in-ss':''}" ${ssColor?`style="border-left-color:${ssColor}"`:''}>
    <div class="ex-head">
      ${ssLabel?`<span class="ss-tag" style="background:${ssColor}">SUPERSET ${ssLabel}</span>`:''}
      <button class="ex-name-btn" data-act="exinfo" data-i="${i}">${esc(ex.name)}</button>
      <button class="iconbtn" data-act="exmenu" data-i="${i}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
      </button>
    </div>
    <input class="ex-note" data-act="note" data-i="${i}" value="${esc(e.notes)}" placeholder="Add notes here...">
    <div class="rest-line" data-act="rest" data-i="${i}">
      ⏱ Rest Timer: <b style="color:var(--accent)">${e.restSec?fmtClock(e.restSec):'OFF'}</b>
    </div>
    <table class="sets">
      <thead><tr>
        <th style="width:38px">Set</th><th style="width:76px">Previous</th>
        ${setHeaderCells(ex)}
        <th style="width:40px"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="addset" data-act="addset" data-i="${i}">＋ Add Set</button>
  </div>`;
}

function setHeaderCells(ex){
  if(ex.type==='d') return `<th>Time</th><th>RPE</th>`;
  if(ex.type==='c') return `<th>Dist</th><th>Time</th>`;
  if(ex.type==='b') return `<th>+${unit()}</th><th>Reps</th><th>RPE</th>`;
  return `<th>${unit()}</th><th>Reps</th><th>RPE</th>`;
}
function setInputCells(s, ex, i, si){
  const inp = (field, val, ph, step) =>
    `<td><input class="setinput" inputmode="decimal" data-act="setval" data-f="${field}" data-i="${i}" data-si="${si}" value="${val===''||val==null?'':esc(val)}" placeholder="${ph}"${step?` step="${step}"`:''}></td>`;
  if(ex.type==='d') return inp('durationSec', s.durationSec, 'sec') + inp('rpe', s.rpe, '-');
  if(ex.type==='c') return inp('distance', s.distance, 'mi') + inp('durationSec', s.durationSec, 'sec');
  return inp('weight', s.weight, ex.type==='b'?'0':'0') + inp('reps', s.reps, '0') + inp('rpe', s.rpe, '-');
}
function prevSetText(s, ex){
  if(ex.type==='d') return s.durationSec ? fmtClock(s.durationSec) : '—';
  if(ex.type==='c') return s.distance ? `${s.distance} mi` : '—';
  const w = s.weight===''||s.weight==null ? 0 : s.weight;
  if(ex.type==='b') return (+w>0 ? `+${w} × ${s.reps}` : `${s.reps} reps`);
  return `${w} ${unit()} × ${s.reps}`;
}

function updateSessionStats(){
  if(!active) return;
  const vol = active.exercises.reduce((a,e)=>a+exerciseVolume(e),0);
  const sets = active.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  el('sessVolume').textContent = nf(vol)+' '+unit();
  el('sessSets').textContent = sets;
}

/* ---------- session interactions ---------- */
function wireSessionEvents(){
  const body = el('sessBody');
  body.querySelectorAll('[data-act]').forEach(node=>{
    const act = node.dataset.act, i = +node.dataset.i, si = +node.dataset.si;
    if(act==='setval'){
      node.addEventListener('input', ev=>{
        active.exercises[i].sets[si][ev.target.dataset.f] = ev.target.value;
        persistActive(); updateSessionStats();
      });
    } else if(act==='note'){
      node.addEventListener('input', ev=>{ active.exercises[i].notes = ev.target.value; persistActive(); });
    } else if(act==='check'){
      node.addEventListener('click', ()=>toggleSetDone(i, si));
    } else if(act==='settype'){
      node.addEventListener('click', ()=>openSetTypeMenu(i, si));
    } else if(act==='addset'){
      node.addEventListener('click', ()=>{
        const e = active.exercises[i];
        e.sets.push(newSet('normal', e.sets[e.sets.length-1]));
        persistActive(); renderSession();
      });
    } else if(act==='rest'){
      node.addEventListener('click', ()=>openRestPicker(i));
    } else if(act==='exmenu'){
      node.addEventListener('click', ()=>openExerciseMenu(i));
    } else if(act==='exinfo'){
      node.addEventListener('click', ()=>openExerciseDetail(active.exercises[i].exId));
    }
  });
}

function toggleSetDone(i, si){
  const e = active.exercises[i], s = e.sets[si];
  s.done = !s.done;
  if(s.done){
    // default blanks to 0 so the set counts
    if(s.reps==='' && exById(e.exId).type!=='d' && exById(e.exId).type!=='c') s.reps = 0;
    if(s.weight==='') s.weight = 0;
    // PR check against records captured before this session
    if(!priorRecordsCache[e.exId]) priorRecordsCache[e.exId] = exerciseRecords(e.exId);
    const prs = detectPRs(e.exId, s, priorRecordsCache[e.exId]);
    if(prs.length) toast('🏆 ' + prs[0] + ' — ' + exName(e.exId), true);
    // rest timer: skipped when the NEXT set is a drop set
    const next = e.sets[si+1];
    if(!(next && next.type==='drop') && e.restSec>0) startRest(e.restSec);
  }
  persistActive(); renderSession();
}

function openSetTypeMenu(i, si){
  const cur = active.exercises[i].sets[si].type;
  sheet('Set Type', `
    <div class="menu-item" data-t="normal"><span class="k">1</span> Normal Set ${cur==='normal'?'✓':''}</div>
    <div class="menu-item" data-t="warmup"><span class="k" style="color:var(--warmup)">W</span> Warm Up Set ${cur==='warmup'?'✓':''}</div>
    <div class="menu-item" data-t="drop"><span class="k" style="color:var(--drop)">D</span> Drop Set ${cur==='drop'?'✓':''}</div>
    <div class="menu-item" data-t="failure"><span class="k" style="color:var(--failure)">F</span> Failure Set ${cur==='failure'?'✓':''}</div>
    <div class="divider"></div>
    <div class="menu-item" data-t="__del" style="color:var(--bad)"><span class="k">✕</span> Remove Set</div>
  `, root=>{
    root.querySelectorAll('[data-t]').forEach(n=>n.onclick = ()=>{
      const t = n.dataset.t;
      if(t==='__del'){
        if(active.exercises[i].sets.length>1) active.exercises[i].sets.splice(si,1);
      } else active.exercises[i].sets[si].type = t;
      persistActive(); closeSheet(); renderSession();
    });
  });
}

function openRestPicker(i){
  const opts = [0,30,45,60,75,90,105,120,150,180,210,240,300];
  const cur = active.exercises[i].restSec;
  sheet('Rest Timer — '+exName(active.exercises[i].exId),
    opts.map(o=>`<div class="menu-item" data-v="${o}">${o===0?'Off':fmtClock(o)} ${o===cur?'✓':''}</div>`).join(''),
    root=>{
      root.querySelectorAll('[data-v]').forEach(n=>n.onclick=()=>{
        active.exercises[i].restSec = +n.dataset.v;
        persistActive(); closeSheet(); renderSession();
      });
    });
}

function openExerciseMenu(i){
  const e = active.exercises[i];
  const canSuperset = active.exercises.length > 1;
  sheet(exName(e.exId), `
    <div class="menu-item" data-a="info"><span class="k">ℹ</span> View exercise details &amp; records</div>
    ${canSuperset?`<div class="menu-item" data-a="superset"><span class="k">⇄</span> ${e.supersetId?'Change / remove superset':'Add to superset'}</div>`:''}
    <div class="menu-item" data-a="up"><span class="k">↑</span> Move up</div>
    <div class="menu-item" data-a="down"><span class="k">↓</span> Move down</div>
    <div class="menu-item" data-a="replace"><span class="k">⟳</span> Replace exercise</div>
    <div class="divider"></div>
    <div class="menu-item" data-a="remove" style="color:var(--bad)"><span class="k">✕</span> Remove exercise</div>
  `, root=>{
    root.querySelectorAll('[data-a]').forEach(n=>n.onclick=()=>{
      const a = n.dataset.a;
      if(a==='remove'){ active.exercises.splice(i,1); }
      else if(a==='up' && i>0){ const t=active.exercises[i]; active.exercises[i]=active.exercises[i-1]; active.exercises[i-1]=t; }
      else if(a==='down' && i<active.exercises.length-1){ const t=active.exercises[i]; active.exercises[i]=active.exercises[i+1]; active.exercises[i+1]=t; }
      else if(a==='info'){ closeSheet(); openExerciseDetail(e.exId); return; }
      else if(a==='superset'){ closeSheet(); openSupersetPicker(i); return; }
      else if(a==='replace'){
        closeSheet();
        openExercisePicker({single:true, onPick:ids=>{
          if(ids[0]){ active.exercises[i].exId = ids[0]; priorRecordsCache[ids[0]] = exerciseRecords(ids[0]); }
          persistActive(); renderSession();
        }});
        return;
      }
      persistActive(); closeSheet(); renderSession();
    });
  });
}

function openSupersetPicker(i){
  const e = active.exercises[i];
  const others = active.exercises.map((x,idx)=>({x,idx})).filter(o=>o.idx!==i);
  sheet('Superset', `
    <div class="muted" style="margin-bottom:10px;">Pair this exercise with another so they're grouped together.</div>
    ${others.map(o=>`<div class="menu-item" data-i="${o.idx}"><span class="k">＋</span> ${esc(exName(o.x.exId))}</div>`).join('')}
    ${e.supersetId?`<div class="divider"></div><div class="menu-item" data-i="__clear" style="color:var(--bad)"><span class="k">✕</span> Remove from superset</div>`:''}
  `, root=>{
    root.querySelectorAll('[data-i]').forEach(n=>n.onclick=()=>{
      const v = n.dataset.i;
      if(v==='__clear'){ e.supersetId = null; }
      else {
        const other = active.exercises[+v];
        const id = other.supersetId || e.supersetId || uid('ss');
        e.supersetId = id; other.supersetId = id;
      }
      persistActive(); closeSheet(); renderSession();
    });
  });
}

/* ---------- finish / discard ---------- */
el('sessMinimize').onclick = minimizeSession;
el('sessTitle').oninput = ev=>{ if(active){ active.name = ev.target.value; persistActive(); } };
el('sessAddEx').onclick = ()=>openExercisePicker({onPick:ids=>{
  ids.forEach(id=>{
    active.exercises.push(newExEntry(id));
    priorRecordsCache[id] = exerciseRecords(id);
  });
  persistActive(); renderSession();
}});
el('sessDiscard').onclick = ()=>{
  if(!confirm('Discard this workout? Nothing will be saved.')) return;
  active = null; restTimer = null; save(LS.active, null);
  clearInterval(sessionTick);
  el('sessionScreen').classList.remove('on');
  renderRoutines();
};
el('sessFinish').onclick = finishSession;

function finishSession(){
  if(!active) return;
  const doneSets = active.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  if(doneSets === 0){
    if(!confirm('No sets are marked complete. Save anyway?')) return;
  }
  // strip incomplete sets
  const exercises = active.exercises.map(e=>({
    exId:e.exId, notes:e.notes, restSec:e.restSec, supersetId:e.supersetId,
    sets: e.sets.filter(s=>s.done).map(s=>({
      type:s.type, weight:+s.weight||0, reps:+s.reps||0,
      durationSec:+s.durationSec||0, distance:+s.distance||0,
      rpe: s.rpe===''?null:+s.rpe, done:true
    }))
  })).filter(e=>e.sets.length>0);

  if(exercises.length === 0 && doneSets === 0){
    toast('Nothing to save'); return;
  }

  const date = active.backfillDate
      ? new Date(active.backfillDate).toISOString()
      : active.startedAt;
  const durationSec = active.backfillDate
      ? (active.plannedDuration || Math.round(sessionElapsed()))
      : Math.round(sessionElapsed());

  // PR summary against records BEFORE this workout
  const prList = [];
  exercises.forEach(e=>{
    const before = priorRecordsCache[e.exId] || exerciseRecords(e.exId, date);
    let bestForEx = null;
    e.sets.forEach(s=>{
      const prs = detectPRs(e.exId, s, before);
      if(prs.length && !bestForEx) bestForEx = prs[0];
    });
    if(bestForEx) prList.push({name:exName(e.exId), pr:bestForEx});
  });

  const w = stamp({id:active.id, name:active.name, date, durationSec, routineId:active.routineId, exercises});
  const existing = workouts.findIndex(x=>x.id===w.id);
  if(existing>=0) workouts[existing]=w; else workouts.push(w);
  workouts.sort((a,b)=> a.date < b.date ? -1 : 1);
  save(LS.workouts, workouts);

  active = null; restTimer = null; save(LS.active, null);
  clearInterval(sessionTick);
  el('sessionScreen').classList.remove('on');
  showSummary(w, prList);
  renderAll();
  if(typeof cloudSync === 'function') cloudSync({quiet:true});
}

function showSummary(w, prList){
  const vol = workoutVolume(w), sets = workoutSetCount(w);
  sheet('Workout Complete 💪', `
    <h3 style="font-size:19px;margin-bottom:3px;">${esc(w.name)}</h3>
    <div class="muted" style="margin-bottom:14px;">${fmtDateTime(w.date)}</div>
    <div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-box"><div class="lb">Duration</div><div class="vl">${fmtDur(w.durationSec)}</div></div>
      <div class="stat-box"><div class="lb">Volume</div><div class="vl">${nf(vol)}<span style="font-size:12px"> ${unit()}</span></div></div>
      <div class="stat-box"><div class="lb">Sets</div><div class="vl">${sets}</div></div>
      <div class="stat-box"><div class="lb">Reps</div><div class="vl">${workoutRepCount(w)}</div></div>
    </div>
    ${prList.length?`<div class="card" style="background:var(--panel2);border-color:var(--warn);">
      <h4 style="color:var(--warn);font-size:13px;margin-bottom:8px;">🏆 ${prList.length} PERSONAL RECORD${prList.length>1?'S':''}</h4>
      ${prList.map(p=>`<div class="hist-line"><span>${esc(p.name)}</span><span class="l">${p.pr}</span></div>`).join('')}
    </div>`:''}
    ${w.exercises.map(e=>`<div style="margin-bottom:11px;">
      <div style="font-weight:700;font-size:14px;color:var(--accent);">${esc(exName(e.exId))}</div>
      ${e.sets.map((s,i)=>`<div class="hist-line"><span class="l">${s.type==='normal'?('Set '+(i+1)):SET_TYPES[s.type]+' set'}</span><span>${esc(prevSetText(s, exById(e.exId)))}</span></div>`).join('')}
    </div>`).join('')}
    <button class="btn block" style="margin-top:10px;" onclick="closeSheet()">Done</button>
  `);
}

/* =====================================================================
   PART 3 — SHEETS, ROUTINES, EXERCISE PICKER, HISTORY, EXERCISE DETAIL
   ===================================================================== */

/* ---------- sheet/modal ---------- */
function sheet(title, html, onMount, center){
  const root = el('modalRoot');
  const ov = document.createElement('div');
  ov.className = 'overlay'+(center?' center':'');
  ov.innerHTML = `<div class="sheet">
      <div class="sheet-head"><h2>${esc(title)}</h2>
        <button class="iconbtn" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="sheet-body"></div>
    </div>`;
  ov.querySelector('.sheet-body').innerHTML = html;
  ov.querySelector('[data-close]').onclick = ()=>ov.remove();
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
  root.appendChild(ov);
  if(onMount) onMount(ov.querySelector('.sheet-body'), ov);
  return ov;
}
function closeSheet(){
  const all = el('modalRoot').querySelectorAll('.overlay');
  if(all.length) all[all.length-1].remove();
}
window.closeSheet = closeSheet;

/* ---------- exercise picker ---------- */
function openExercisePicker(opts){
  opts = opts||{};
  let selected = [];
  let q = '', mf = '', ef = '';
  const ov = sheet(opts.single?'Replace Exercise':'Add Exercises', `
    <input type="text" id="pkSearch" placeholder="Search..." style="margin-bottom:9px;">
    <div class="scroll-x" id="pkMuscle" style="margin-bottom:6px;"></div>
    <div class="scroll-x" id="pkEquip" style="margin-bottom:10px;"></div>
    <div id="pkList"></div>
    ${opts.single?'':'<button class="btn block" id="pkAdd" style="margin-top:12px;position:sticky;bottom:0;">Add 0 exercises</button>'}
  `, root=>{
    const muscleKeys = [...new Set(allEx().map(e=>e.primary))].filter(Boolean).sort((a,b)=>MUSCLES[a]<MUSCLES[b]?-1:1);
    root.querySelector('#pkMuscle').innerHTML =
      `<span class="pill on" data-m="">All muscles</span>` +
      muscleKeys.map(m=>`<span class="pill" data-m="${m}">${MUSCLES[m]||m}</span>`).join('');
    root.querySelector('#pkEquip').innerHTML =
      `<span class="pill on" data-e="">All equipment</span>` +
      EQUIPMENT.map(e=>`<span class="pill" data-e="${e}">${e}</span>`).join('');

    function draw(){
      const list = allEx().filter(e=>
        (!q || e.name.toLowerCase().includes(q)) &&
        (!mf || e.primary===mf) &&
        (!ef || e.equipment===ef)
      ).sort((a,b)=>a.name<b.name?-1:1);
      root.querySelector('#pkList').innerHTML = list.length ? list.map(e=>{
        const n = selected.indexOf(e.id);
        return `<div class="ex-row ${n>=0?'sel':''}" data-id="${esc(e.id)}">
          <div class="ex-av">${esc(e.name.slice(0,2).toUpperCase())}</div>
          <div><div class="nm">${esc(e.name)}</div><div class="dim">${MUSCLES[e.primary]||e.primary} · ${esc(e.equipment)}</div></div>
          ${n>=0?`<div class="cnt">${n+1}</div>`:''}
        </div>`;
      }).join('') : '<div class="empty">No exercises match.</div>';
      root.querySelectorAll('#pkList .ex-row').forEach(r=>r.onclick=()=>{
        const id = r.dataset.id;
        if(opts.single){ opts.onPick([id]); ov.remove(); return; }
        const n = selected.indexOf(id);
        if(n>=0) selected.splice(n,1); else selected.push(id);
        draw();
        const b = root.querySelector('#pkAdd');
        if(b) b.textContent = `Add ${selected.length} exercise${selected.length===1?'':'s'}`;
      });
    }
    root.querySelector('#pkSearch').oninput = e=>{ q = e.target.value.toLowerCase().trim(); draw(); };
    root.querySelectorAll('#pkMuscle .pill').forEach(p=>p.onclick=()=>{
      root.querySelectorAll('#pkMuscle .pill').forEach(x=>x.classList.remove('on'));
      p.classList.add('on'); mf = p.dataset.m; draw();
    });
    root.querySelectorAll('#pkEquip .pill').forEach(p=>p.onclick=()=>{
      root.querySelectorAll('#pkEquip .pill').forEach(x=>x.classList.remove('on'));
      p.classList.add('on'); ef = p.dataset.e; draw();
    });
    const addBtn = root.querySelector('#pkAdd');
    if(addBtn) addBtn.onclick = ()=>{
      if(!selected.length){ toast('Select at least one exercise'); return; }
      opts.onPick(selected); ov.remove();
    };
    draw();
  });
}

/* ---------- routines ---------- */
function renderRoutines(){
  const wrap = el('routinesList');
  const grouped = {};
  folders.forEach(f=>grouped[f.id]=[]);
  grouped['__none'] = [];
  routines.forEach(r=>{ (grouped[r.folderId] ? grouped[r.folderId] : grouped['__none']).push(r); });

  let html = '';
  if(active){
    html += `<div class="card" style="border-color:var(--accent);background:var(--accent-dim);">
      <div class="row spread"><div><b>Workout in progress</b><div class="muted">${esc(active.name)}</div></div>
      <button class="btn sm" id="resumeBtn">Resume</button></div></div>`;
  }
  const sections = [];
  folders.forEach(f=>sections.push({id:f.id, name:f.name, items:grouped[f.id]||[]}));
  sections.push({id:'__none', name: folders.length?'Ungrouped':'My Routines', items:grouped['__none']});

  sections.forEach(sec=>{
    if(sec.id==='__none' && sec.items.length===0 && folders.length) return;
    html += `<div class="folder-head"><h3>${esc(sec.name)}</h3>${
      sec.id!=='__none'?`<button class="iconbtn" data-delfolder="${esc(sec.id)}" title="Delete folder">✕</button>`:''
    }</div>`;
    if(sec.items.length===0){
      html += `<div class="dim" style="padding:2px 2px 10px;">No routines here yet.</div>`;
    }
    sec.items.forEach(r=>{
      html += `<div class="routine-card">
        <div class="row spread" style="align-items:flex-start;">
          <h4>${esc(r.name)}</h4>
          <button class="iconbtn" data-rmenu="${esc(r.id)}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
          </button>
        </div>
        <div class="exlist">${r.exercises.length
            ? r.exercises.map(e=>`${e.sets.length} × ${esc(exName(e.exId))}`).join('<br>')
            : 'No exercises'}</div>
        <button class="btn sm block" data-start="${esc(r.id)}" style="margin-top:10px;">Start Routine</button>
      </div>`;
    });
  });
  if(routines.length===0 && !active){
    html += `<div class="empty">Create a routine to save a workout day you repeat<br>(Leg Day, Upper Day, Push…), then start it in one tap.</div>`;
  }
  wrap.innerHTML = html;

  const rb = el('resumeBtn'); if(rb) rb.onclick = openSession;
  wrap.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{
    const r = routines.find(x=>x.id===b.dataset.start);
    startSession({name:r.name, routineId:r.id, exercises:r.exercises});
  });
  wrap.querySelectorAll('[data-rmenu]').forEach(b=>b.onclick=()=>openRoutineMenu(b.dataset.rmenu));
  wrap.querySelectorAll('[data-delfolder]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this folder? Routines inside move to Ungrouped.')) return;
    routines.forEach(r=>{ if(r.folderId===b.dataset.delfolder){ r.folderId=null; stamp(r); } });
    tombstone('folder', {id:b.dataset.delfolder});
    folders = folders.filter(f=>f.id!==b.dataset.delfolder);
    save(LS.folders, folders); save(LS.routines, routines); renderRoutines();
  });
}

function openRoutineMenu(id){
  const r = routines.find(x=>x.id===id);
  sheet(r.name, `
    <div class="menu-item" data-a="edit"><span class="k">✎</span> Edit routine</div>
    <div class="menu-item" data-a="dup"><span class="k">⧉</span> Duplicate</div>
    <div class="menu-item" data-a="move"><span class="k">🗂</span> Move to folder</div>
    <div class="divider"></div>
    <div class="menu-item" data-a="del" style="color:var(--bad)"><span class="k">✕</span> Delete routine</div>
  `, root=>{
    root.querySelectorAll('[data-a]').forEach(n=>n.onclick=()=>{
      const a=n.dataset.a; closeSheet();
      if(a==='edit') openRoutineEditor(r);
      else if(a==='dup'){
        routines.push(Object.assign({}, JSON.parse(JSON.stringify(r)), {id:uid('r'), name:r.name+' (copy)'}));
        save(LS.routines, routines); renderRoutines();
      } else if(a==='move'){
        sheet('Move to folder',

}

function openRoutineEditor(existing){

  const ov = sheet(existing?'Edit Routine':'New Routine', `

  `, root=>{
    function draw(){
      root.querySelector('#rtEx').innerHTML = r.exercises.length ? r.exercises.map((e,i)=>{
        const ex = exById(e.exId);
        return `<div class="card" style="background:var(--panel2);margin-bottom:9px;">
          <div class="row spread"><b style="font-size:14px;color:var(--accent)">${esc(ex.name)}</b>

              <button class="iconbtn" data-mv="down" data-i="${i}">↓</button>
              <button class="iconbtn" data-rm="${i}" style="color:var(--bad)">✕</button>
            </div>
          </div>
          <div class="row" style="margin-top:8px;gap:8px;">
            <div style="flex:1;"><label class="fl">Sets</label>
              <input type="number" min="1" max="20" data-sets="${i}" value="${e.sets.length}"></div>
            <div style="flex:1;"><label class="fl">Target reps</label>
              <input type="number" min="0" data-reps="${i}" value="${esc(e.sets[0]&&e.sets[0].reps!==''?e.sets[0].reps:'')}" placeholder="—"></div>
            <div style="flex:1;"><label class="fl">Rest</label>
              <select data-rest="${i}">
                ${[0,30,45,60,75,90,120,150,180,240,300].map(o=>`<option value="${o}" ${o===e.restSec?'selected':''}>${o===0?'Off':fmtClock(o)}</option>`).join('')}
              </select></div>
          </div>
          <input type="text" data-note="${i}" value="${esc(e.notes||'')}" placeholder="Exercise notes..." style="margin-top:8px;">
        </div>`;
      }).join('') : '<div class="dim" style="padding:6px 2px;">No exercises yet.</div>';

      root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ r.exercises.splice(+b.dataset.rm,1); draw(); });
      root.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, d=b.dataset.mv==='up'?-1:1, j=i+d;
        if(j<0||j>=r.exercises.length) return;
        const t=r.exercises[i]; r.exercises[i]=r.exercises[j]; r.exercises[j]=t; draw();
      });
      root.querySelectorAll('[data-sets]').forEach(inp=>inp.onchange=()=>{
        const i=+inp.dataset.sets, n=Math.max(1, Math.min(20, +inp.value||1)), e=r.exercises[i];
        while(e.sets.length<n) e.sets.push(newSet('normal', e.sets[e.sets.length-1]));
        while(e.sets.length>n) e.sets.pop();
        draw();
      });
      root.querySelectorAll('[data-reps]').forEach(inp=>inp.oninput=()=>{
        const i=+inp.dataset.reps; r.exercises[i].sets.forEach(s=>s.reps = inp.value);
      });
      root.querySelectorAll('[data-rest]').forEach(sel=>sel.onchange=()=>{ r.exercises[+sel.dataset.rest].restSec = +sel.value; });
      root.querySelectorAll('[data-note]').forEach(inp=>inp.oninput=()=>{ r.exercises[+inp.dataset.note].notes = inp.value; });
    }
    root.querySelector('#rtAddEx').onclick = ()=>openExercisePicker({onPick:ids=>{
      ids.forEach(id=>r.exercises.push(newExEntry(id)));
      draw();
    }});
    root.querySelector('#rtSave').onclick = ()=>{
      r.name = root.querySelector('#rtName').value.trim();
      r.folderId = root.querySelector('#rtFolder').value || null;
      if(!r.name){ toast('Give the routine a name'); return; }
      if(!r.exercises.length){ toast('Add at least one exercise'); return; }
      stamp(r);
      const i = routines.findIndex(x=>x.id===r.id);
      if(i>=0) routines[i]=r; else routines.push(r);
      save(LS.routines, routines);
      ov.remove(); renderRoutines(); toast('Routine saved');
    };
    draw();
  });
}

function renderHistory(){
  const wrap = el('historyList');
  if(!workouts.length){ wrap.innerHTML = '<div class="empty">No workouts yet.<br>Finish a session and it will show up here.</div>'; return; }
  wrap.innerHTML = [...workouts].reverse().map(w=>{
    const vol = workoutVolume(w);
    const prs = w.prCount||0;
    return `<div class="hist-item" data-w="${esc(w.id)}">
      <div class="row spread"><h4>${esc(w.name)}</h4>${prs?`<span class="badge pr">${prs} PR</span>`:''}</div>
      <div class="muted" style="font-size:12px;">${fmtDateTime(w.date)}</div>
      <div class="hist-meta">
        <span>⏱ ${fmtDur(w.durationSec)}</span>
        <span>🏋 ${nf(vol)} ${unit()}</span>
        <span>📋 ${workoutSetCount(w)} sets</span>
      </div>
      ${w.exercises.slice(0,4).map(e=>{
        const best = bestSetOf(e);
        return `<div class="hist-line"><span class="l">${e.sets.length} × ${esc(exName(e.exId))}</span><span>${best}</span></div>`;
      }).join('')}
      ${w.exercises.length>4?`<div class="dim" style="margin-top:5px;">+ ${w.exercises.length-4} more</div>`:''}
    </div>`;
  }).join('');
  wrap.querySelectorAll('.hist-item').forEach(n=>n.onclick=()=>openWorkoutDetail(n.dataset.w));
}
function bestSetOf(e){
  const ex = exById(e.exId);
  let best=null, bv=-1;
  (e.sets||[]).forEach(s=>{ const v=setVolume(s,ex)||setLoad(s,ex); if(v>bv){bv=v;best=s;} });
  return best ? esc(prevSetText(best, ex)) : '—';
}

/* ---------- tiny SVG line chart ---------- */
function lineChart(points, opts){
  opts = opts||{};
  const W=320, H=120, pad={l:6,r:6,t:12,b:18};
  if(!points.length) return '<div class="empty" style="padding:18px;">Not enough data yet.</div>';
  if(points.length === 1){
    return `<div style="text-align:center;padding:22px 0;">
      <div style="font-size:26px;font-weight:800;">${opts.fmt?opts.fmt(points[0].v):nf(points[0].v)}</div>
      <div class="dim">${fmtDate(points[0].d)} — log this again to see a trend</div></div>`;
  }
  const vals = points.map(p=>p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || Math.max(1, max*0.1);
  const lo = min - span*0.15, hi = max + span*0.15;
  const x = i => pad.l + (i/(points.length-1))*(W-pad.l-pad.r);
  const y = v => pad.t + (1-(v-lo)/(hi-lo))*(H-pad.t-pad.b);
  const path = points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = path + ` L${x(points.length-1).toFixed(1)},${H-pad.b} L${pad.l},${H-pad.b} Z`;
  const dots = points.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${points.length>24?1.6:2.6}" fill="var(--accent)"/>`).join('');
  const gid = 'g'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:120px;">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>
  <div class="row spread dim" style="margin-top:-4px;">
    <span>${fmtDate(points[0].d)}</span>
    <span style="color:var(--text);font-weight:700;">${opts.fmt?opts.fmt(points[points.length-1].v):nf(points[points.length-1].v)}</span>
    <span>${fmtDate(points[points.length-1].d)}</span>
  </div>`;
}

  `, root=>{
    function filtered(){
      if(range==='all') return hist;
      const cut = range==='3m' ? addDays(todayISO(), -92) : addDays(todayISO(), -366);
      return hist.filter(h=>dayOf(h.date) >= cut);
    }
    function series(){
      return filtered().map(h=>{
        let v=0, sessVol=0, reps=0;
        h.sets.forEach(s=>{
          if(!setCounts(s)) return;
          sessVol += setVolume(s,ex); reps += (+s.reps||0);
          if(metric==='heaviest') v = Math.max(v, setLoad(s,ex));
          if(metric==='orm')      v = Math.max(v, set1RM(s,ex));
          if(metric==='setvol')   v = Math.max(v, setVolume(s,ex));
        });
        if(metric==='sessvol') v = sessVol;
        if(metric==='reps')    v = reps;
        return {d:h.date, v};
      }).filter(p=>p.v>0);
    }
    function draw(){
      const suffix = (metric==='reps') ? '' : ' '+unit();
      root.querySelector('#edChart').innerHTML = lineChart(series(), {fmt:v=>nf(v)+suffix});
      root.querySelector('#edRecords').innerHTML = `
        <div class="stat-box"><div class="lb">Heaviest Weight</div><div class="vl">${rec.heaviest?nf(rec.heaviest):'—'}<span style="font-size:12px"> ${rec.heaviest?unit():''}</span></div></div>
        <div class="stat-box"><div class="lb">Est. 1RM</div><div class="vl">${rec.best1RM?nf(rec.best1RM):'—'}<span style="font-size:12px"> ${rec.best1RM?unit():''}</span></div><div class="sub">Epley formula</div></div>
        <div class="stat-box"><div class="lb">Best Set Volume</div><div class="vl">${rec.bestSetVol?nf(rec.bestSetVol):'—'}</div></div>
        <div class="stat-box"><div class="lb">Best Session Volume</div><div class="vl">${rec.bestSessionVol?nf(rec.bestSessionVol):'—'}</div></div>`;
      const reps = Object.keys(rec.repRecords).map(Number).sort((a,b)=>a-b);
      root.querySelector('#edSetRecords').innerHTML = reps.length
        ? reps.map(r=>`<div class="hist-line"><span class="l">${r} rep${r>1?'s':''}</span><span><b>${nf(rec.repRecords[r])} ${unit()}</b></span></div>`).join('')
        : '<div class="dim">No weighted sets logged yet.</div>';
      root.querySelector('#edHistory').innerHTML = hist.length
        ? [...hist].reverse().map(h=>`<div class="card" style="background:var(--panel2);padding:11px 12px;">
            <div class="row spread"><b style="font-size:13px;">${esc(h.workoutName)}</b><span class="dim">${fmtDate(h.date)}</span></div>
            ${h.sets.map((s,i)=>`<div class="hist-line"><span class="l">${s.type==='normal'?'Set '+(i+1):SET_TYPES[s.type]}</span><span>${esc(prevSetText(s,ex))}</span></div>`).join('')}
          </div>`).join('')
        : '<div class="dim">No sessions logged yet.</div>';
    }
    root.querySelectorAll('#edMetric .pill').forEach(p=>p.onclick=()=>{
      root.querySelectorAll('#edMetric .pill').forEach(x=>x.classList.remove('on'));
      p.classList.add('on'); metric = p.dataset.k; draw();
    });
    root.querySelectorAll('#edRange .pill').forEach(p=>p.onclick=()=>{
      root.querySelectorAll('#edRange .pill').forEach(x=>x.classList.remove('on'));
      p.classList.add('on'); range = p.dataset.r; draw();
    });
    draw();
  });
}

function paintBody(agg, scope){
  const max = Math.max(1, ...Object.values(agg));
  Object.keys(MUSCLE_SVG).forEach(m=>{
    const v = agg[m]||0, ratio = v/max;
    let c = SKIN;
    if(v>0) c = ratio>0.66 ? '#8b5cf6' : ratio>0.33 ? '#3b82f6' : '#2f5090';
    MUSCLE_SVG[m].forEach(id=>{
      const n = scope.querySelector('#'+id);
      if(n) n.setAttribute('fill', c);
    });
  });
}

/* ---------- profile dashboard ---------- */
let dashRange = 'week';
function renderProfile(){
  const wrap = el('profileBody');
  const now = todayISO();
  const thisWeekStart = startOfWeek(now);
  const lastWeekStart = addDays(thisWeekStart, -7);
  const inRange = (w,a,b)=> dayOf(w.date)>=a && (!b || dayOf(w.date)<b);
  const thisWeek = workouts.filter(w=>inRange(w, thisWeekStart, null));
  const lastWeek = workouts.filter(w=>inRange(w, lastWeekStart, thisWeekStart));

  const agg = s => ({
    vol: s.reduce((a,w)=>a+workoutVolume(w),0),
    sets: s.reduce((a,w)=>a+workoutSetCount(w),0),
    reps: s.reduce((a,w)=>a+workoutRepCount(w),0),
    dur: s.reduce((a,w)=>a+(w.durationSec||0),0),
    n: s.length
  });
  const tw = agg(thisWeek), lw = agg(lastWeek);
  const delta = (a,b)=> b===0 ? null : Math.round(((a-b)/b)*100);
  const dTag = d => d===null ? '' : `<div class="sub" style="color:${d>=0?'var(--good)':'var(--bad)'}">${d>=0?'+':''}${d}% vs last week</div>`;

  // 12-week volume series
  const weeks = [];
  for(let i=11;i>=0;i--){
    const ws = addDays(thisWeekStart, -7*i), we = addDays(ws, 7);
    const s = workouts.filter(w=>inRange(w, ws, we));
    weeks.push({d:ws, v:agg(s).vol});
  }

  // sets per muscle group, this week
  const spm = setsPerMuscle(thisWeek);
  const spmSorted = Object.keys(spm).sort((a,b)=>spm[b]-spm[a]).slice(0,10);
  const spmMax = Math.max(1, ...spmSorted.map(k=>spm[k]));

  // muscle distribution (all-time volume)
  const vpm = volumePerMuscle(workouts);
  const vpmTotal = Object.values(vpm).reduce((a,b)=>a+b,0) || 1;
  const vpmSorted = Object.keys(vpm).sort((a,b)=>vpm[b]-vpm[a]).slice(0,8);

  // calendar: last 12 weeks
  const daySet = new Set(workouts.map(w=>dayOf(w.date)));
  let calCells = '';
  const calStart = addDays(thisWeekStart, -7*11);
  for(let i=0;i<84;i++){
    const d = addDays(calStart, i);
    calCells += `<div class="${daySet.has(d)?'on':''}" title="${d}"></div>`;
  }
  // streak
  let streak = 0;
  {
    let cur = now;
    if(!daySet.has(cur)) cur = addDays(cur,-1);
    while(daySet.has(cur)){ streak++; cur = addDays(cur,-1); }
  }

  const bw = bodyLog.length ? bodyLog[bodyLog.length-1] : null;

  wrap.innerHTML = `
    <div class="card">
      <div class="row spread" style="margin-bottom:12px;">
        <h2 style="margin:0;">This Week</h2>
        <span class="dim">${fmtDate(thisWeekStart)} →</span>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="lb">Workouts</div><div class="vl">${tw.n}</div>${dTag(delta(tw.n,lw.n))}</div>
        <div class="stat-box"><div class="lb">Volume</div><div class="vl">${nf(tw.vol)}<span style="font-size:11px"> ${unit()}</span></div>${dTag(delta(tw.vol,lw.vol))}</div>
        <div class="stat-box"><div class="lb">Sets</div><div class="vl">${tw.sets}</div>${dTag(delta(tw.sets,lw.sets))}</div>
        <div class="stat-box"><div class="lb">Time</div><div class="vl">${fmtDur(tw.dur)}</div>${dTag(delta(tw.dur,lw.dur))}</div>
      </div>
    </div>

    <div class="card">
      <h2>Volume — last 12 weeks</h2>
      ${lineChart(weeks.filter(w=>w.v>0), {fmt:v=>nf(v)+' '+unit()})}
    </div>

    <div class="card">
      <h2>Sets per Muscle Group — this week</h2>
      ${spmSorted.length ? spmSorted.map(k=>`
        <div class="bar-row">
          <span class="nm">${MUSCLES[k]||k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(spm[k]/spmMax*100).toFixed(0)}%"></div></div>
          <span class="vl">${spm[k]%1?spm[k].toFixed(1):spm[k]}</span>
        </div>`).join('')
      : '<div class="dim">No sets logged this week yet.</div>'}
      <div class="dim" style="margin-top:8px;">Primary muscle counts as 1 set, secondary as 0.5. Warm-up sets excluded.</div>
    </div>

    <div class="card">
      <h2>Muscle Distribution — all time</h2>
      ${vpmSorted.length ? vpmSorted.map(k=>`
        <div class="bar-row">
          <span class="nm">${MUSCLES[k]||k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(vpm[k]/vpmTotal*100).toFixed(0)}%;background:var(--purple)"></div></div>
          <span class="vl">${(vpm[k]/vpmTotal*100).toFixed(0)}%</span>
        </div>`).join('')
      : '<div class="dim">No volume logged yet.</div>'}
    </div>

    <div class="card">
      <div class="row spread"><h2 style="margin:0;">Muscles Worked</h2>
        <div class="row" style="gap:5px;">
          <span class="pill ${dashRange==='week'?'on':''}" data-br="week">This week</span>
          <span class="pill ${dashRange==='all'?'on':''}" data-br="all">All time</span>
        </div>
      </div>
      <div class="body-wrap" id="bodyWrap" style="margin-top:12px;">
        <div style="text-align:center;flex:1;"><div class="dim" style="margin-bottom:4px;">FRONT</div>${bodyFrontSVG()}</div>
        <div style="text-align:center;flex:1;"><div class="dim" style="margin-bottom:4px;">BACK</div>${bodyBackSVG()}</div>
      </div>
      <div class="legend">
        <span><i style="background:${SKIN}"></i>None</span>
        <span><i style="background:#2f5090"></i>Light</span>
        <span><i style="background:#3b82f6"></i>Moderate</span>
        <span><i style="background:#8b5cf6"></i>Heavy</span>
      </div>
    </div>

    <div class="card">
      <div class="row spread" style="margin-bottom:10px;"><h2 style="margin:0;">Consistency</h2>
        <span class="dim">${streak} day streak · ${workouts.length} total</span></div>
      <div class="cal">
        ${['M','T','W','T','F','S','S'].map(d=>`<div class="hd">${d}</div>`).join('')}
        ${calCells}
      </div>
    </div>

    <div class="card">
      <div class="row spread" style="margin-bottom:10px;"><h2 style="margin:0;">Body Weight</h2>
        <button class="btn xs sec" id="addBwBtn">＋ Log</button></div>
      ${bw ? `<div class="row spread" style="margin-bottom:8px;">
                <span class="vl" style="font-size:22px;font-weight:800;">${bw.weight} ${unit()}</span>
                <span class="dim">${fmtDate(bw.date)}</span></div>
              ${lineChart(bodyLog.map(b=>({d:b.date, v:+b.weight})), {fmt:v=>v+' '+unit()})}`
            : '<div class="dim">No entries yet — tap Log to add your weight.</div>'}
    </div>
  `;

  const bwEl = el('bodyWrap');
  const bodyAgg = setsPerMuscle(dashRange==='week' ? thisWeek : workouts);
  paintBody(bodyAgg, bwEl);
  wrap.querySelectorAll('[data-br]').forEach(p=>p.onclick=()=>{ dashRange=p.dataset.br; renderProfile(); });
  const ab = el('addBwBtn');
  if(ab) ab.onclick = ()=>{
    sheet('Log Body Weight', `
      <label class="fl">Weight (${unit()})</label>
      <input type="number" step="0.1" id="bwVal" value="${esc(bw?bw.weight:'')}" style="margin-bottom:12px;">
      <label class="fl">Date</label>
      <input type="date" id="bwDate" value="${todayISO()}" style="margin-bottom:16px;">
      <button class="btn block" id="bwSave">Save</button>
    `, root=>{
      root.querySelector('#bwSave').onclick = ()=>{
        const v = +root.querySelector('#bwVal').value;
        const d = root.querySelector('#bwDate').value;
        if(!v || !d){ toast('Enter a weight and date'); return; }
        bodyLog = bodyLog.filter(b=>b.date!==d);
        bodyLog.push(stamp({date:d, weight:v}));
        bodyLog.sort((a,b)=>a.date<b.date?-1:1);
        save(LS.bodyLog, bodyLog);
        if(profile){ profile.bodyweight = v; save(LS.profile, profile); }
        closeSheet(); renderProfile(); toast('Logged');
      };
    }, true);
  };
}

function readBackupFile(file, done){
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      const r = importData(d);
      done(null, r);
    }catch(e){ done(e); }
  };
  rd.onerror = ()=>done(new Error('Could not read that file'));
  rd.readAsText(file);
}
