/* =====================================================================
   PART 5 — CLOUD SYNC

   Offline-first. localStorage stays the source of truth; the cloud is a
   replica. Every network call is best-effort — the app must work in a gym
   basement with no signal, so nothing here ever blocks the UI.

   Conflict resolution is last-write-wins on updatedAt. One person can't be
   in two gyms at once, so genuine concurrent edits are near-impossible and
   a CRDT would be complexity for nothing.
   ===================================================================== */

const CLOUD = {
  // All three are public by design: the client id and domain end up in the
  // browser regardless, and the API is authorised by JWT, not by obscurity.
  api:      "https://mzqyaplq2naklpmhtzh3ch36340kxqgl.lambda-url.us-east-1.on.aws",
  domain:   "https://liftlog-937485903079.auth.us-east-1.amazoncognito.com",
  clientId: "55s97g354jr3al3jdsk5a0or6g",
  scope:    "email openid profile"
};

const LS_TOKENS = 'll_tokens';
const LS_TOMB   = 'll_tombstones';
const LS_SYNC   = 'll_sync';

let tokens     = load(LS_TOKENS, null);
let tombstones = load(LS_TOMB, []);
let syncMeta   = load(LS_SYNC, {lastSyncAt:null, lastError:null, lastOkAt:null});

const cloudConfigured = () => /^https?:\/\//.test(CLOUD.api) && !!CLOUD.clientId;
const signedIn = () => !!(tokens && tokens.refresh_token);
function redirectUri(){ return location.origin + '/'; }

/* ---------- PKCE ---------- */
function randomVerifier(){
  const bytes = new Uint8Array(64);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~"[b % 66]).join('');
}
function b64urlFromBytes(bytes){
  let s = '';
  bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function challengeFor(verifier){
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64urlFromBytes(new Uint8Array(digest));
}

async function cloudSignIn(){
  if(!cloudConfigured()){ toast('Cloud sync not configured'); return; }
  const verifier = randomVerifier();
  sessionStorage.setItem('ll_pkce', verifier);
  const challenge = await challengeFor(verifier);
  const q = new URLSearchParams({
    client_id: CLOUD.clientId,
    response_type: 'code',
    scope: CLOUD.scope,
    redirect_uri: redirectUri(),
    code_challenge: challenge,
    code_challenge_method: 'S256'
  });
  location.href = `${CLOUD.domain}/oauth2/authorize?${q}`;
}

function cloudSignOut(){
  tokens = null; save(LS_TOKENS, null);
  syncMeta = {lastSyncAt:null, lastError:null, lastOkAt:null};
  save(LS_SYNC, syncMeta);
  toast('Signed out — local data untouched');
  renderAll();
}

function storeTokens(t){
  tokens = {
    access_token:  t.access_token,
    id_token:      t.id_token,
    // A refresh response omits refresh_token; keep the existing one.
    refresh_token: t.refresh_token || (tokens && tokens.refresh_token),
    expiresAt:     Date.now() + ((+t.expires_in || 3600) * 1000)
  };
  save(LS_TOKENS, tokens);
}

/* Runs on every load. If the URL carries ?code= we just came back from the
   hosted UI, so exchange it and strip the query string — leaving a used
   code in history is untidy and mildly leaky. */
async function handleAuthRedirect(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if(!code) return false;

  const verifier = sessionStorage.getItem('ll_pkce');
  history.replaceState({}, '', location.pathname);
  sessionStorage.removeItem('ll_pkce');
  if(!verifier) return false;

  try{
    const res = await fetch(`${CLOUD.domain}/oauth2/token`, {
      method:'POST',
      headers:{'content-type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        grant_type:'authorization_code',
        client_id: CLOUD.clientId,
        code,
        redirect_uri: redirectUri(),
        code_verifier: verifier
      })
    });
    if(!res.ok) throw new Error('token exchange failed');
    storeTokens(await res.json());
    toast('Signed in');
    return true;
  }catch(e){
    toast('Sign-in failed');
    return false;
  }
}

async function accessToken(){
  if(!tokens) return null;
  if(tokens.access_token && Date.now() < tokens.expiresAt - 60000) return tokens.access_token;
  if(!tokens.refresh_token) return null;
  try{
    const res = await fetch(`${CLOUD.domain}/oauth2/token`, {
      method:'POST',
      headers:{'content-type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        grant_type:'refresh_token',
        client_id: CLOUD.clientId,
        refresh_token: tokens.refresh_token
      })
    });
    if(!res.ok) throw new Error('refresh failed');
    storeTokens(await res.json());
    return tokens.access_token;
  }catch(e){
    // Refresh tokens last 30 days; past that the user signs in again.
    tokens = null; save(LS_TOKENS, null);
    return null;
  }
}

async function cloudFetch(path, options){
  const tok = await accessToken();
  if(!tok) throw new Error('not signed in');
  const res = await fetch(CLOUD.api.replace(/\/+$/,'') + path, Object.assign({}, options, {
    headers: Object.assign({authorization:`Bearer ${tok}`}, (options && options.headers) || {})
  }));
  if(!res.ok){
    const body = await res.text().catch(()=> '');
    throw new Error(`${res.status} ${body.slice(0,120)}`);
  }
  return res.json();
}

/* ---------- entity <-> sort key mapping ---------- */
function stamp(obj){
  if(obj && typeof obj === 'object') obj.updatedAt = new Date().toISOString();
  return obj;
}
/* One-time cleanup for records that got in before build 7's identity check.
   A remote item whose data lacked an `id` could never match an existing
   local row, so every sync appended another copy — showing up as duplicate
   workouts with an "undefined" date and a NaN duration. Harmless to run
   repeatedly; it only ever removes rows that can't be rendered anyway. */
function pruneInvalid(){
  const str = v => typeof v === 'string' && v.length > 0;
  const before = [workouts.length, routines.length, folders.length, customEx.length, bodyLog.length];

  workouts = workouts.filter(w => w && str(w.id) && str(w.date) && !Number.isNaN(Date.parse(w.date)));
  routines = routines.filter(r => r && str(r.id));
  folders  = folders.filter(f  => f && str(f.id));
  customEx = customEx.filter(e => e && str(e.id));
  bodyLog  = bodyLog.filter(b  => b && str(b.date));

  const after = [workouts.length, routines.length, folders.length, customEx.length, bodyLog.length];
  const removed = before.reduce((a,n,i)=>a+(n-after[i]), 0);
  if(removed){
    save(LS.workouts, workouts); save(LS.routines, routines); save(LS.folders, folders);
    save(LS.customEx, customEx); save(LS.bodyLog, bodyLog);
    console.warn(`Removed ${removed} malformed record(s)`);
  }
  return removed;
}

function ensureStamped(){
  const now = new Date().toISOString();
  let touched = false;
  const fix = o => { if(o && !o.updatedAt){ o.updatedAt = now; touched = true; } };
  if(profile) fix(profile);
  workouts.forEach(fix); routines.forEach(fix);
  folders.forEach(fix); customEx.forEach(fix); bodyLog.forEach(fix);
  if(touched){
    save(LS.profile,profile); save(LS.workouts,workouts); save(LS.routines,routines);
    save(LS.folders,folders); save(LS.customEx,customEx); save(LS.bodyLog,bodyLog);
  }
}

function skFor(kind, obj){
  switch(kind){
    case 'profile':  return 'PROFILE';
    case 'workout':  return `WORKOUT#${dayOf(obj.date)}#${obj.id}`;
    case 'routine':  return `ROUTINE#${obj.id}`;
    case 'folder':   return `FOLDER#${obj.id}`;
    case 'exercise': return `EXERCISE#${obj.id}`;
    case 'body':     return `BODY#${obj.date}`;
  }
}

function tombstone(kind, obj){
  const sk = skFor(kind, obj);
  if(!sk) return;
  tombstones = tombstones.filter(t => t.sk !== sk);
  tombstones.push({sk, updatedAt:new Date().toISOString()});
  // Keep this bounded — a tombstone older than the refresh-token lifetime
  // can't still be needed by any device that will ever sync again.
  const cutoff = Date.now() - 90*86400000;
  tombstones = tombstones.filter(t => Date.parse(t.updatedAt) > cutoff);
  save(LS_TOMB, tombstones);
}

function localItems(){
  const out = [];
  const push = (kind, obj) => {
    const sk = skFor(kind, obj);
    // Defensive: the API rejects a bad timestamp with a 400 that fails the
    // whole batch, so drop the offender rather than block every other item.
    if(!sk || sk.includes('undefined')) return;
    if(typeof obj.updatedAt !== 'string' || Number.isNaN(Date.parse(obj.updatedAt))) return;
    out.push({sk, type:kind, updatedAt:obj.updatedAt, data:obj});
  };
  if(profile) push('profile', profile);
  workouts.forEach(w => push('workout', w));
  routines.forEach(r => push('routine', r));
  folders.forEach(f => push('folder', f));
  customEx.forEach(e => push('exercise', e));
  bodyLog.forEach(b => push('body', b));
  tombstones.forEach(t => out.push({sk:t.sk, type:'tombstone', updatedAt:t.updatedAt, deleted:true, data:{}}));
  return out;
}

function applyRemoteItem(item){
  const [kind, ...rest] = item.sk.split('#');
  const id = kind === 'WORKOUT' ? rest[1] : rest[0];

  /* A live remote item and a local tombstone for the same key are in
     conflict — resolve by timestamp like anything else. Without this, a
     stale local delete would keep re-killing a record another device has
     since recreated. */
  if(!item.deleted){
    const ti = tombstones.findIndex(t => t.sk === item.sk);
    if(ti >= 0){
      if(item.updatedAt > tombstones[ti].updatedAt){
        tombstones.splice(ti, 1);
        save(LS_TOMB, tombstones);
      } else {
        return false;   // our delete is newer; it stands
      }
    }
  }

  const collections = {
    ROUTINE:  {arr:()=>routines,  key:LS.routines,  match:o=>o.id===id},
    FOLDER:   {arr:()=>folders,   key:LS.folders,   match:o=>o.id===id},
    EXERCISE: {arr:()=>customEx,  key:LS.customEx,  match:o=>o.id===id},
    WORKOUT:  {arr:()=>workouts,  key:LS.workouts,  match:o=>o.id===id},
    BODY:     {arr:()=>bodyLog,   key:LS.bodyLog,   match:o=>o.date===id}
  };

  if(item.sk === 'PROFILE'){
    if(item.deleted) return false;
    if(!profile || !profile.updatedAt || item.updatedAt > profile.updatedAt){
      profile = Object.assign({}, item.data, {updatedAt: item.updatedAt});
      save(LS.profile, profile); return true;
    }
    return false;
  }

  const c = collections[kind];
  if(!c) return false;
  const arr = c.arr();
  const i = arr.findIndex(c.match);

  /* The envelope's updatedAt is authoritative — copy it onto the record.
     Without this, anything written by a client that didn't embed updatedAt
     (a curl test, say) comes back unstamped and is then rejected on the
     next push with "updatedAt must be an ISO 8601 timestamp". */
  const incoming = Object.assign({}, item.data, {updatedAt: item.updatedAt});

  /* Reject remote records missing the fields that identify them. A
     malformed item would otherwise render as a blank workout and be
     impossible to delete from the UI. */
  const identified =
    kind === 'BODY' ? typeof incoming.date === 'string'
    : kind === 'WORKOUT' ? (typeof incoming.id === 'string' && typeof incoming.date === 'string')
    : typeof incoming.id === 'string';
  if(!item.deleted && !identified) return false;

  if(item.deleted){
    if(i >= 0 && (!arr[i].updatedAt || item.updatedAt > arr[i].updatedAt)){
      arr.splice(i,1); save(c.key, arr); return true;
    }
    return false;
  }

  if(i < 0){ arr.push(incoming); save(c.key, arr); return true; }
  if(!arr[i].updatedAt || item.updatedAt > arr[i].updatedAt){
    arr[i] = incoming; save(c.key, arr); return true;
  }
  return false;
}

let syncing = false;
async function cloudSync(opts){
  opts = opts || {};
  if(syncing || !signedIn() || !navigator.onLine) return null;
  syncing = true;
  renderSyncStatus();
  try{
    ensureStamped();
    const since = syncMeta.lastSyncAt;

    /* Pull BEFORE push. The reverse order loses data on a first sync: with
       no lastSyncAt every local item is considered outgoing, so stale local
       records overwrite newer remote ones, and the subsequent pull just
       reads back what was clobbered. Pulling first merges by timestamp, so
       whatever is pushed afterwards is already the winning version. */
    const res = await cloudFetch('/sync' + (since ? `?since=${encodeURIComponent(since)}` : ''));
    let changed = 0;
    (res.items || []).forEach(it => { if(applyRemoteItem(it)) changed++; });

    // Applying remote items can introduce records the earlier pass never
    // saw, so stamp again before deciding what to send.
    ensureStamped();

    const outgoing = since ? localItems().filter(i => i.updatedAt > since) : localItems();
    for(let i = 0; i < outgoing.length; i += 400){
      await cloudFetch('/sync', {
        method:'POST',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({items: outgoing.slice(i, i+400)})
      });
    }

    syncMeta = {lastSyncAt: res.serverTime, lastOkAt: new Date().toISOString(), lastError: null};
    save(LS_SYNC, syncMeta);

    if(changed){ renderAll(); }
    if(!opts.quiet) toast(changed ? `Synced — ${changed} update${changed>1?'s':''}` : 'Synced');
    return {pushed: outgoing.length, pulled: changed};
  }catch(e){
    syncMeta.lastError = String(e.message || e);
    save(LS_SYNC, syncMeta);
    if(!opts.quiet) toast('Sync failed: ' + syncMeta.lastError.slice(0,60));
    return null;
  }finally{
    syncing = false;
    renderSyncStatus();
  }
}

function syncStatusText(){
  if(!cloudConfigured()) return 'Not configured';
  if(!signedIn()) return 'Not signed in';
  if(syncing) return 'Syncing…';
  if(syncMeta.lastError) return 'Last sync failed';
  if(syncMeta.lastOkAt){
    const mins = Math.floor((Date.now() - Date.parse(syncMeta.lastOkAt))/60000);
    if(mins < 1) return 'Synced just now';
    if(mins < 60) return `Synced ${mins}m ago`;
    return `Synced ${Math.floor(mins/60)}h ago`;
  }
  return 'Signed in — not synced yet';
}
function renderSyncStatus(){
  const n = document.getElementById('stSyncStatus');
  if(n) n.textContent = syncStatusText();
}

/* ---------- service worker + install ---------- */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol === 'file:') return;   // SW needs http(s)
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

async function init(){
  fitAppHeight();
  ['resize','orientationchange','pageshow'].forEach(ev=>
    window.addEventListener(ev, ()=>setTimeout(fitAppHeight, 60)));
  if(window.visualViewport) window.visualViewport.addEventListener('resize', ()=>setTimeout(fitAppHeight, 60));

  // Must run before the first render: returning from the hosted UI, the URL
  // carries ?code= which needs exchanging and stripping.
  const justSignedIn = await handleAuthRedirect().catch(()=>false);

  // Clear anything malformed before the first render, so bad rows never
  // reach the UI as blank cards that can't be deleted.
  pruneInvalid();

  renderAll();
  registerSW();
  requestPersistence();
  if(!profile){ showOnboarding(); }
  else if(active){ openSession(); }
  // snapshot on load so there's always a rollback point from the last session
  if(workouts.length) takeSnapshot('app opened');

  // Opportunistic and non-blocking. Quiet on load so a failed sync in a gym
  // with no signal doesn't nag; explicit "Sync Now" reports either way.
  if(signedIn()) cloudSync({quiet: !justSignedIn});
  window.addEventListener('online', ()=>cloudSync({quiet:true}));
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') cloudSync({quiet:true});
  });
}
init();

</script>
